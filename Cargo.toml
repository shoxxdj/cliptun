[package]
name = "cliptun"
version = "0.1.0"
edition = "2021"
description = "POC: tunnel TCP (via SOCKS5) through a shared clipboard"

[features]
default = ["clip"]
clip = ["dep:arboard"]

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros"] }
arboard = { version = "3", optional = true }

[profile.release]
opt-level = 3
