[package]
name = "cliptun"
version = "0.2.0"
edition = "2021"
description = "POC: tunnel TCP (SOCKS5/SOCKS4/HTTP proxy) through a shared clipboard"
 
[features]
default = ["clip"]
clip = ["dep:arboard"]
 
[dependencies]
anyhow = "1"
base64 = "0.22"
chacha20poly1305 = "0.10"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros"] }
zstd = { version = "0.13", default-features = false }
arboard = { version = "3", optional = true }
 
[profile.release]
opt-level = 3
 
